# docker-compose.yml
# ChromaDB :8002 — run with: docker compose up -d
#
# One service. n8n :5678 was the other until SP50 retired it: it held no state, made no
# decisions, and its whole footprint was two outbound posts and an inbound call to
# /orchestrate that the API serves directly.
services:
  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8002:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
