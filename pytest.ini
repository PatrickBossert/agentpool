[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Integration tests are opt-in. They call the real Anthropic API and expect ChromaDB on
# :8002, so a bare `pytest` used to spend credit and fail on infrastructure that is not
# running - and, less obviously, collecting them changed the result of unit tests, because
# importing a crew module ahead of a test that patches it changes what that patch reaches.
#
# addopts is prepended to the command line, so `pytest -m integration` still overrides this
# and runs them; the last -m wins.
addopts = -m "not integration"

markers =
    integration: marks tests as integration tests (require ANTHROPIC_API_KEY + running ChromaDB)
    real_authority: exercises caller_may_commit/caller_may_submit for real, opting out of a
        module's autouse grant so the test proves the rule rather than a patched stand-in
